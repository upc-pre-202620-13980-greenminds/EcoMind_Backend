name: Backend CI and CD

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Pull request conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate Conventional Commit title and GitFlow target
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          if ! [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^\)]+\))?\!?:\ .+ ]]; then
            echo 'Use a Conventional Commit title, for example: test(community): cover event registrations'
            exit 1
          fi
          if [[ "$BASE_BRANCH" == main && ! "$HEAD_BRANCH" =~ ^(release/|hotfix/|develop$) ]]; then
            echo 'Integrate features into develop; use release/* or hotfix/* for main.'
            exit 1
          fi

  verify:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [h2, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecomind_test
          POSTGRES_USER: ecomind_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecomind_test -d ecomind_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYVERSION'
          import os, re, xml.etree.ElementTree as ET
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH.')
          version = ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          if tag != 'v' + version:
              raise SystemExit('The release tag must match the project version in pom.xml.')
          PYVERSION
      - name: Select PostgreSQL test database
        if: matrix.database == 'postgresql'
        shell: bash
        run: |
          echo 'TEST_DATABASE_URL=jdbc:postgresql://localhost:5432/ecomind_test' >> "$GITHUB_ENV"
          echo 'TEST_DATABASE_DRIVER=org.postgresql.Driver' >> "$GITHUB_ENV"
          echo 'TEST_DATABASE_USERNAME=ecomind_test' >> "$GITHUB_ENV"
          echo 'TEST_DATABASE_PASSWORD=test-only-password' >> "$GITHUB_ENV"
      - name: Compile, test and package
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.database }}
          path: |
            target/surefire-reports/
            target/cucumber/
            target/site/jacoco/
          retention-days: 14
          if-no-files-found: error
      - name: Upload verified application
        if: matrix.database == 'postgresql'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ github.sha }}
          path: target/ecomind-backend-*.jar
          retention-days: 14
          if-no-files-found: error

  container:
    name: Build deployment image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ecomind-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Request Render deployment
    needs: [verify, container]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    steps:
      - name: Deploy the verified commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo 'Configure the production secret RENDER_DEPLOY_HOOK_URL before enabling CD.'
            exit 1
          fi
          case "$RENDER_DEPLOY_HOOK_URL" in
            https://api.render.com/deploy/*) ;;
            *) echo 'Expected a Render HTTPS deploy hook.'; exit 1 ;;
          esac
          # Render accepts ref to pin the request to the commit that passed CI.
          code=$(curl --silent --output render-response.json --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 90 --request POST \
            --get --data-urlencode "ref=$DEPLOY_COMMIT" "$RENDER_DEPLOY_HOOK_URL")
          if [[ "$code" != 200 && "$code" != 202 ]]; then
            echo "Render rejected the deployment request (HTTP $code)."
            exit 1
          fi
          echo "Render accepted deployment request for $DEPLOY_COMMIT (HTTP $code)." >> "$GITHUB_STEP_SUMMARY"
