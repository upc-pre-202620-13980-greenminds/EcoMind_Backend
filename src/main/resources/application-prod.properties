server.port=${PORT}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

iam.email.provider=${EMAIL_PROVIDER:resend}
iam.email.resend.api-key=${RESEND_API_KEY:}
iam.email.resend.from-email=${RESEND_FROM_EMAIL:}

payments.culqi.secret-key=${CULQI_SECRET_KEY:}
payments.paypal.client-id=${PAYPAL_CLIENT_ID:}
payments.paypal.secret=${PAYPAL_SECRET:}
iam.password-recovery.url=${PASSWORD_RECOVERY_URL:ecomind://authentication/reset-password}

iam.email.azure.connection-string=${AZURE_EMAIL_CONNECTION_STRING:}
iam.email.azure.from-email=${AZURE_EMAIL_FROM_EMAIL:}

community.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
community.cloudinary.api-key=${CLOUDINARY_API_KEY}
community.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
