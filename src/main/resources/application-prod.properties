server.port=${PORT}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

iam.email.resend.api-key=${RESEND_API_KEY}
iam.email.resend.from-email=${RESEND_FROM_EMAIL}

payments.culqi.secret-key=${CULQI_SECRET_KEY:}
payments.paypal.client-id=${PAYPAL_CLIENT_ID:}
payments.paypal.secret=${PAYPAL_SECRET:}
iam.password-recovery.url=${PASSWORD_RECOVERY_URL:ecomind://authentication/reset-password}
