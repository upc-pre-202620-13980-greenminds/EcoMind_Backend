server.port=8092

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local development defaults. Override them with environment variables when needed.
authorization.jwt.secret=${JWT_SECRET:ecomind-local-development-secret-key-2026}
authorization.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
