<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{title}} · EcoMind</title>
  <style>
    :root { --brand: #69a44e; --ink: #262626; --muted: #616161; --surface: #f7f9f4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
    main { width: min(27rem, calc(100vw - 3rem)); margin: clamp(3rem, 12vh, 7rem) auto; }
    .brand { color: #3f662d; font-size: 1.5rem; font-weight: 750; margin: 0 0 2.5rem; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.2rem); line-height: 1.2; margin: 0 0 1.25rem; }
    p { margin: 0 0 1.5rem; }
    .open { display: block; text-align: center; padding: 1rem 1.5rem; border-radius: 1rem; background: var(--brand); color: #16230f; font-weight: 750; text-decoration: none; margin: 2rem 0 1.5rem; }
    .open:hover { background: #7eb962; }
    .open:focus-visible { outline: 3px solid #262626; outline-offset: 4px; }
    .notice { color: var(--muted); font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <p class="brand">EcoMind</p>
    <h1>{{title}}</h1>
    <p>{{body}}</p>
    <a class="open" href="{{link}}" rel="noreferrer">{{open}}</a>
    <p class="notice">{{notice}}</p>
  </main>
</body>
</html>
