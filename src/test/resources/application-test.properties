spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:ecomind;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE ALIAS IF NOT EXISTS clock_timestamp FOR "pe.greenminds.ecomind.support.H2Clock.timestamp"}
spring.datasource.driver-class-name=${TEST_DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DATABASE_USERNAME:sa}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

authorization.jwt.secret=test-only-secret-key-with-at-least-32-bytes
authorization.jwt.expiration-minutes=60

gamification.outbox.enabled=false
gamification.streak-closure.enabled=false
gamification.minigame.repetition-factors=1,0.8,0.5,0.2

# Non-empty test-only placeholders satisfy the Cloudinary bean's fail-fast checks.
# Integration tests do not contact Cloudinary; these values are never credentials.
community.cloudinary.cloud-name=test-cloud
community.cloudinary.api-key=test-api-key
community.cloudinary.api-secret=test-api-secret
